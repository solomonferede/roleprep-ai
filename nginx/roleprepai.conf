# Nginx configuration for RolePrepAI
# This file should be placed in /etc/nginx/sites-available/
# and symlinked to /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name roleprepai.solomonferede.com.et;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Server name
    server_name roleprepai.solomonferede.com.et;
    
    # SSL certificate paths (Certbot will update these)
    # Certbot will automatically populate these paths
    ssl_certificate /etc/letsencrypt/live/roleprepai.solomonferede.com.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roleprepai.solomonferede.com.et/privkey.pem;
    
    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Gzip compression configuration
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    
    # Client max body size (5MB for file uploads if needed)
    client_max_body_size 5m;
    
    # Logging
    access_log /var/log/nginx/roleprepai.access.log combined;
    error_log /var/log/nginx/roleprepai.error.log warn;
    
    # Serve static files directly from the staticfiles directory
    # This reduces load on Django application server
    location /static/ {
        alias /home/solomon/roleprep-ai/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve media files if needed in future
    location /media/ {
        alias /home/solomon/roleprep-ai/media/;
        expires 7d;
    }
    
    # Proxy requests to Django application
    location / {
        # Reverse proxy settings
        proxy_pass http://127.0.0.1:8000;
        
        # Preserve original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Disable buffering for better streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Health check endpoint (internal only)
    location /health/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to .env and other config files
    location ~ ^/(\.env|\.env\.example|db\.sqlite3|manage\.py)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
