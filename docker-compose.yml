version: '3.9'

services:
  web:
    # Build Docker image from Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    
    # Container name for easier management
    container_name: roleprepai-web
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Volume mounts for persistent data
    volumes:
      # Mount staticfiles directory for Nginx to serve
      - ./staticfiles:/app/staticfiles:ro
      # Mount logs directory for debugging
      - ./logs:/app/logs
    
    # Expose port 8000 internally only (Nginx reverse proxy on host)
    ports:
      - "127.0.0.1:8000:8000"
    
    # Restart policy: always restart unless explicitly stopped
    restart: unless-stopped
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    
    # Resource limits (adjust based on your VPS resources)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '1'
          memory: 512M

# Named volumes (if needed in future)
volumes: {}

# Networks (using default bridge network)
networks:
  default:
    name: roleprepai-network
