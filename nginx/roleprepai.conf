# This is the Nginx configuration file for the RolePrepAI application.
# It sets up a server block for the domain roleprepai.solomonferede.com.et, handling both HTTP and HTTPS traffic.

# Redirect HTTP traffic to HTTPS 
server {
    listen 80;
    listen [::]:80;
    server_name roleprepai.solomonferede.com.et;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roleprepai.solomonferede.com.et;

    ssl_certificate /etc/letsencrypt/live/roleprepai.solomonferede.com.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roleprepai.solomonferede.com.et/privkey.pem;

    access_log /var/log/nginx/roleprepai.access.log combined;
    error_log /var/log/nginx/roleprepai.error.log warn;

    location /static/ {
        alias /home/solomon/roleprep-ai/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}